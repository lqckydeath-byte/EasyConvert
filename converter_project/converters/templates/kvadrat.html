{% extends 'base.html' %}
{% block title %}Квадрат{% endblock %}
{% block content %}
<h1>Квадрат</h1>
<form method="post" class="form">
    {% csrf_token %}
    <input type="number" step="any" name="value" placeholder="Введите число">
    <button type="submit">Посчитать</button>
</form>
{% if result is not None %}
<p class="result">Результат: {{ result }}</p>
{% endif %}
{% endblock %}
