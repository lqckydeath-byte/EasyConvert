{% extends 'base.html' %}
{% block title %}Температура{% endblock %}
{% block content %}
<h1>Температура</h1>
<form method="post" class="form">
    {% csrf_token %}
    <input type="number" step="any" name="value" placeholder="Температура в °C">
    <button type="submit">Конвертировать</button>
</form>
{% if result is not None %}
<p class="result">Результат: {{ result }} °F</p>
{% endif %}
{% endblock %}
