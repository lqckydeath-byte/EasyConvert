{% extends 'base.html' %}
{% block title %}Время{% endblock %}
{% block content %}
<h1>Время</h1>
<form method="post" class="form">
    {% csrf_token %}
    <input type="number" step="any" name="value" placeholder="Введите число">
    <label>Из <select name="from_unit"><option value="sec">сек</option><option value="min">мин</option><option value="hour">часы</option></select></label>
    <label>В <select name="to_unit"><option value="sec">сек</option><option value="min">мин</option><option value="hour">часы</option></select></label>
    <button type="submit">Считать</button>
</form>
{% if result is not None %}
<p class="result">Результат: {{ result }}</p>
{% endif %}
{% endblock %}
